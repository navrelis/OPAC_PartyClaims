modLoader="javafml" #mandatory
loaderVersion="${neoforge_loader_version_range}" #mandatory
license="${license}"
issueTrackerURL="${issues}" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${version}" #mandatory
displayName="${mod_display_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
displayURL="${homepage}" #optional
logoFile="${mod_id}.png" #optional
# credits="Thanks for this example mod goes to Java" #optional
authors="${mod_author} and other contributors" #optional
# mandatory
description="${description}"
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"
[[mixins]]
config = "${mod_id}.create.mixins.json"
[[mixins]]
config = "${mod_id}.create.neoforge.mixins.json"
[[dependencies.${mod_id}]]
    modId="neoforge" #mandatory
    type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
    versionRange="${neoforge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
    versionRange="${forge_minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="create"
    type="optional" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
    versionRange="${create_neoforge_range}"
    ordering="NONE"
    side="BOTH"
# [Team Claims] optional, any version (an unsupported one only turns the party sync off): loads after FTB Teams,
# whose party teams the parties are kept in sync with
[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
