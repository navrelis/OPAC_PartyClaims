name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build both loaders
        run: ./gradlew :Fabric:build :NeoForge:build

      # Headless boot test (Fabric API gametest server, -Dfabric-api.gametest). Vanilla's
      # GameTestServer ends the JVM with System.exit(<failed required tests>) and Fabric API
      # exits non-zero when the server cannot start, so Gradle fails this step on a failure.
      - name: Fabric boot test
        run: ./gradlew :Fabric:runBootTest --console=plain

      # Do not rely on the exit code alone: require vanilla's success line in the log, so a run
      # that ended without actually running the tests cannot pass.
      - name: Check boot test result
        run: grep -E "All [0-9]+ required tests passed" run-boottest/logs/latest.log

      # Same shared Team Claims gametests on NeoForge's gametest server. The task fails on failed
      # tests (non-zero exit) and itself requires the success line in the log (a server that never
      # starts exits 0 on NeoForge).
      - name: NeoForge gametests
        run: ./gradlew :NeoForge:runTeamClaimsGameTest --console=plain

      - name: Check NeoForge gametest result
        run: grep -E "All [0-9]+ required tests passed" NeoForge/runs/teamClaimsGameTest/logs/latest.log

      # The runs above are without FTB Teams, which proves that it is optional. These two run the same
      # tests plus the FTB Teams party sync tests with FTB Teams, FTB Library and Architectury installed.
      # Both tasks fail on failed tests and themselves require the success line in the log.
      - name: Fabric boot test with FTB Teams
        run: ./gradlew :Fabric:runBootTestFtb --console=plain

      - name: Check boot test with FTB Teams result
        run: grep -E "All [0-9]+ required tests passed" run-boottest-ftb/logs/latest.log

      - name: NeoForge gametests with FTB Teams
        run: ./gradlew :NeoForge:runTeamClaimsGameTestFtb --console=plain

      - name: Check NeoForge gametest with FTB Teams result
        run: grep -E "All [0-9]+ required tests passed" NeoForge/runs/teamClaimsGameTestFtb/logs/latest.log