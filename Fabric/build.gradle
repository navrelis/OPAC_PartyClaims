plugins {
    id 'idea'
    // 1.8-SNAPSHOT (used by upstream) is no longer resolvable: its plugin marker
    // has been pruned from maven.fabricmc.net. 1.11.8 is the minimum currently
    // resolvable loom version that still supports Gradle 8.x (Gradle 8.14+) and
    // matches our fixed Java 21 toolchain; see settings.gradle for how the
    // 'fabric-loom' plugin id is resolved to this version's module coordinates.
    id 'fabric-loom' version '1.11.8'
}

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

repositories{
    maven {
        url = "https://mvn.devos.one/snapshots"
    }// Create and several dependencies
    maven {
        url = "https://mvn.devos.one/releases"
    } // Porting Lib releases
    maven {
        url = "https://maven.jamieswhiteshirt.com/libs-release"
    } // Reach Entity Attributes
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly project(":Common")
    compileOnly project(":CreateSupportCommon")

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6"//source: https://github.com/Fuzss/forgeconfigapiport-fabric

    // Dev/test only: fabric-gametest-api-v1 backs the ":Fabric:runBootTest" headless boot test
    // (see loom.runs.bootTest and the "gametest" source set below). It is deliberately excluded
    // from the "fabric-api" umbrella jar ("devOnlyModules" in fabric-api's own build.gradle) so
    // it must be added explicitly. Version pinned to the module version shipped with
    // fabric_version=0.116.17+1.21.1, per fabric-api's gradle.properties
    // (fabric-gametest-api-v1-version=2.0.5, +<commit hash>).
    // modImplementation (not modRuntimeOnly): the "gametest" source set below compiles against
    // this too (it implements FabricGameTest), via its compileClasspath merge with main's.
    // Still dev-only: never include()'d, so it never ends up in the shipped mod jar, and it is
    // not declared in the production fabric.mod.json's "depends".
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:2.0.5+6fc22b9919"

    modCompileOnly "curse.maven:ftbranks-472659:6431745"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-ranks-fabric
    modCompileOnly("dev.architectury:architectury-fabric:${architectury_version}") { transitive = false }//source: https://github.com/architectury/architectury-api
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }//source: https://github.com/FTBTeam/FTB-Library

    modCompileOnly "net.luckperms:api:5.4"//source: https://github.com/LuckPerms/LuckPerms
    modCompileOnly 'me.lucko:fabric-permissions-api:0.2-SNAPSHOT'//source: https://github.com/lucko/fabric-permissions-api

    modCompileOnly "earth.terrarium.prometheus:prometheus-fabric-1.20.4:1.4.2"//source: https://github.com/terrarium-earth/Prometheus
    modCompileOnly "earth.terrarium.argonauts:argonauts-fabric-1.20.4:1.2.4"//source: https://modrinth.com/mod/odyssey-allies

    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }//source: https://github.com/FTBTeam/FTB-Teams
    modCompileOnly("com.simibubi.create:create-fabric-1.20.1:${fabric_create_version}"){
        exclude(group: "com.jozufozu.flywheel")
        exclude(group: "net.minecraftforge")
    }
}

// Separate "gametest" source set (Fabric/src/gametest/...) for the ":Fabric:runBootTest" smoke
// test: its own fabric.mod.json (mod id "opac_teamclaims_gametest") + a single @GameTest method,
// kept OUT of the production jar (no jar/remapJar task ever reads from this source set, and it
// is not added to processResources/jar/packageSources below).
sourceSets {
    gametest {
        // Loader-neutral test bodies (+ the profile-cache mixin) shared with other loaders.
        // Common/src/gametest is not a source set of :Common itself, so it is only ever compiled
        // here, into this test-only source set, and never into any production jar.
        java.srcDir(project(":Common").file("src/gametest/java"))
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    // [Team Claims] Second dev/test-only mod "opac_teamclaims_gametest_ftb" (Fabric/src/gametest/ftb) for
    // ":Fabric:runBootTestFtb": its fabric.mod.json registers the wrapper class of the FTB Teams sync tests as a
    // "fabric-gametest" entrypoint. The shared test bodies are compiled into "gametest" above (FTB Teams is on the
    // compile classpath of every source set), but nothing in the default run refers to them, so that run never
    // touches an FTB class. FTB Teams, FTB Library and Architectury are only on this source set's runtime classpath
    // (see the modGametestFtbRuntimeOnly dependencies below).
    gametestFtb {
        java.srcDirs = ["src/gametest/ftb/java"]
        resources.srcDirs = ["src/gametest/ftb/resources"]
        compileClasspath += sourceSets.gametest.compileClasspath + sourceSets.gametest.output
        runtimeClasspath += sourceSets.gametest.runtimeClasspath + sourceSets.gametest.output
    }
    // [Team Claims] Third dev/test-only mod "opac_teamclaims_gametest_savecompat" (Fabric/src/gametest/savecompat) for
    // ":Fabric:runSaveCompatTest": the tests that check that the world data of a 1.2.0 server loads (shared bodies in
    // Common/src/gametest, fixture in Common/src/gametest/resources/world-data-from-1.2.0). The run gets the compiled
    // classes of "gametest" (the shared bodies) but not its resources, so the other tests are not registered there.
    gametestSaveCompat {
        java.srcDirs = ["src/gametest/savecompat/java"]
        resources.srcDirs = ["src/gametest/savecompat/resources"]
        compileClasspath += sourceSets.gametest.compileClasspath + sourceSets.gametest.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.gametest.output.classesDirs
    }
}

// [Team Claims] Remapped (intermediary -> named) mod dependencies of the "gametestFtb" source set only: the real
// FTB Teams, FTB Library and Architectury for ":Fabric:runBootTestFtb". Never include()'d, not part of main's
// runtime classpath, so not in the default boot test and not in the jar.
loom.createRemapConfigurations(sourceSets.gametestFtb)

dependencies {
    modGametestFtbRuntimeOnly("dev.architectury:architectury-fabric:${architectury_version}") { transitive = false }
    modGametestFtbRuntimeOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
    modGametestFtbRuntimeOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
        // Calling add(...) at all switches Loom's mixin AP out of its implicit "auto-register
        // every non-test source set with defaultRefmapName" behaviour (see the original
        // fabric-loom#423 proposal: "If the programmer does not configure mixin extension, then
        // the current behaviour should [be] preserved"), so "main" must now be re-added
        // explicitly, or compileJava's mixin AP silently loses its obfuscation-mapping/refmap
        // setup (verified: omitting this line broke compileJava with a flood of "Unable to
        // locate obfuscation mapping" errors on the project's existing main-source-set mixins).
        add(sourceSets.main)
        // The "gametest" source set has its own mixin config (opac_teamclaims_gametest.mixins.json,
        // see Fabric/src/gametest/resources) and needs its own refmap registered, since it isn't
        // covered by defaultRefmapName above (that only applies to source sets added without an
        // explicit name). In a dev run everything is already Mojang-mapped so the refmap is never
        // actually read at runtime, but Loom's mixin annotation processor still wants one
        // configured per source set.
        add(sourceSets.gametest, "opac_teamclaims_gametest.refmap.json")
    }
    // Registers "gametest" as its own dev-time mod (separate from the main "openpartiesandclaims"
    // mod) so Fabric Loader's dev classpath scanning picks up its distinct
    // Fabric/src/gametest/resources/fabric.mod.json as a second mod, the same pattern fabric-api
    // itself uses for its own testmod source sets (see fabric-api's root build.gradle:
    // `loom.mods.register(p.name + "-testmod") { sourceSet p.sourceSets.testmod; ... }`, backing
    // its own `gametest` run that also sets `-Dfabric-api.gametest`).
    mods {
        register("opac_teamclaims_gametest") {
            sourceSet(sourceSets.gametest)
        }
        // [Team Claims] only on the classpath of the bootTestFtb run
        register("opac_teamclaims_gametest_ftb") {
            sourceSet(sourceSets.gametestFtb)
        }
        // [Team Claims] only on the classpath of the saveCompatTest run
        register("opac_teamclaims_gametest_savecompat") {
            sourceSet(sourceSets.gametestSaveCompat)
        }
    }
    runs {
        // Two-client + server dev environment for manual multiplayer testing of party
        // features (see start-all.bat / stop-all.bat in the repo root). runDir() is resolved
        // relative to this subproject's project dir (Fabric/), so "../run-*" lands the run
        // directories at the repository root, matching the "run-*" .gitignore pattern.
        client {
            client()
            setConfigName("Fabric Client 1")
            ideConfigGenerated(true)
            runDir("../run-client1")
            programArgs("--username", "Player1")
        }
        client2 {
            client()
            setConfigName("Fabric Client 2")
            ideConfigGenerated(true)
            runDir("../run-client2")
            programArgs("--username", "Player2")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("../run-server")
            programArgs("nogui")
        }
        // Headless boot-test smoke run (Fabric API gametest headless server). Setting
        // -Dfabric-api.gametest starts a dedicated-server-like environment that bypasses the
        // EULA check, loads the mod plus the "gametest" source set's own
        // opac_teamclaims_gametest mod, then hands off to vanilla's GameTestServer, which runs
        // TeamClaimsSmokeTest#teamClaimsBoots and shuts down.
        // NOTE (verified against fabric-api 0.116.17+1.21.1 / vanilla 1.21.1 source): with ZERO
        // registered @GameTest methods, vanilla net.minecraft.gametest.framework.GameTestServer
        // #create throws "IllegalArgumentException: No test functions were given!" and
        // fabric-gametest-api-v1's own MainMixin#exitOnError then calls System.exit(-1)
        // deliberately (see net.fabricmc.fabric.mixin.gametest.server.MainMixin /
        // net.fabricmc.fabric.impl.gametest.FabricGameTestHelper) -- which is why this run needs
        // the one real test in Fabric/src/gametest to reach a clean exit 0.
        bootTest {
            server()
            setConfigName("Fabric Boot Test")
            ideConfigGenerated(false)
            runDir("../run-boottest")
            vmArg("-Dfabric-api.gametest")
            source(sourceSets.gametest)
        }
        // [Team Claims] The same boot test with FTB Teams, FTB Library and Architectury installed, which adds
        // the FTB Teams sync tests of the "gametestFtb" source set: ":Fabric:runBootTestFtb". The default
        // bootTest run above stays without those mods, which is what proves that FTB Teams is optional.
        bootTestFtb {
            server()
            setConfigName("Fabric Boot Test (FTB Teams)")
            ideConfigGenerated(false)
            runDir("../run-boottest-ftb")
            vmArg("-Dfabric-api.gametest")
            source(sourceSets.gametestFtb)
        }
        // [Team Claims] The save compatibility tests: the server starts on a world folder that holds the OPAC and Team
        // Claims files of a 1.2.0 server (copied by the task configuration below): ":Fabric:runSaveCompatTest".
        saveCompatTest {
            server()
            setConfigName("Fabric Save Compatibility Test")
            ideConfigGenerated(false)
            runDir("../run-savecompat")
            vmArg("-Dfabric-api.gametest")
            vmArg("-Dopac.teamclaims.savecompat=true")
            source(sourceSets.gametestSaveCompat)
        }
    }
}

// TeamClaimsLogicTest's tests are independent (own random UUIDs/parties/coordinates) and clean
// up after themselves, so a normal run doesn't need this. But their fixed, non-random chunk
// coordinates (base offset per test) are reused across runs, so if a run ever gets interrupted
// mid-test (crash, forced stop) before its cleanup runs, a stale claim left behind at one of
// those coordinates could make the next run's claim attempt fail. Deleting the persisted world
// before every ":Fabric:runBootTest" run keeps reruns green regardless.
tasks.named('runBootTest') {
    doFirst {
        delete file("${projectDir}/../run-boottest/world")
    }
}

// [Team Claims] ":Fabric:runBootTestFtb": a fresh world like above, and besides the exit code (failed required
// tests end the JVM with a non-zero exit, which fails this task) the run requires vanilla's success line in its
// log, which is deleted before each run, so a run that never got to the tests cannot pass.
File runDirFtb = rootProject.file("run-boottest-ftb")
tasks.named('runBootTestFtb') {
    doFirst {
        delete new File(runDirFtb, "world"), new File(runDirFtb, "logs/latest.log")
    }
    doLast {
        File log = new File(runDirFtb, "logs/latest.log")
        def passed = log.exists() ? (log.getText("UTF-8") =~ /All (\d+) required tests passed/) : null
        if (passed == null || !passed.find()) {
            throw new GradleException("Team Claims gametests with FTB Teams did not pass: no \"All N required tests passed\" line in ${log}")
        }
        logger.lifecycle("Team Claims gametests with FTB Teams: ${passed.group(0)} (log: ${log})")
    }
}

// [Team Claims] ":Fabric:runSaveCompatTest": the world folder is a fresh copy of the 1.2.0 fixture every time (only
// its "data" folder: the server makes the rest). Besides the exit code the run requires vanilla's success line in its
// log, which is deleted before each run.
File runDirSaveCompat = rootProject.file("run-savecompat")
tasks.named('runSaveCompatTest') {
    doFirst {
        delete new File(runDirSaveCompat, "world"), new File(runDirSaveCompat, "logs/latest.log")
        copy {
            from project(":Common").file("src/gametest/resources/world-data-from-1.2.0/data")
            into new File(runDirSaveCompat, "world/data")
        }
    }
    doLast {
        File log = new File(runDirSaveCompat, "logs/latest.log")
        def passed = log.exists() ? (log.getText("UTF-8") =~ /All (\d+) required tests passed/) : null
        if (passed == null || !passed.find()) {
            throw new GradleException("Team Claims save compatibility gametests did not pass: no \"All N required tests passed\" line in ${log}")
        }
        logger.lifecycle("Team Claims save compatibility gametests: ${passed.group(0)} (log: ${log})")
    }
}

// [Team Claims] The save compatibility run starts the server on claim files of real players, which a vanilla game test
// server cannot do without the mixin of the "gametest" mod that gives it a profile cache (see
// MixinGameTestProfileCache). That mod itself is not part of the run (its fabric.mod.json would register all its
// tests), so its mixin config is shared by this one.
tasks.named("processGametestSaveCompatResources", ProcessResources) {
    from("src/gametest/resources") {
        include "opac_teamclaims_gametest.mixins.json"
    }
}

// [Team Claims] The root build.gradle copies OPAC's lang files into every ProcessResources task; they belong to
// the main mod only, not to the FTB and save compatibility test mods.
["processGametestFtbResources", "processGametestSaveCompatResources"].each { String taskName ->
    tasks.named(taskName, ProcessResources) {
        eachFile { if (it.path.startsWith("data/${project.mod_id}/")) it.exclude() }
    }
}


processResources {
    from project(":Common").sourceSets.main.resources
    from project(":CreateSupportCommon").sourceSets.main.resources
    inputs.property "version", project.version
    exclude "META-INF/*_core.js"
    exclude "META-INF/coremods.json"
}


// Scoped to compileJava (the "main" source set) only -- NOT tasks.withType(JavaCompile), which
// would also reach compileGametestJava and recompile all of Common/CreateSupportCommon a second
// time as part of the gametest source set (duplicate classes; gametest already gets those
// already-compiled classes transitively via sourceSets.main.output above).
compileJava {
    source(project(":Common").sourceSets.main.allSource)
    source(project(":CreateSupportCommon").sourceSets.main.allSource)
}

packageSources {
    from(project(":CreateSupportCommon").sourceSets.main.allSource)//normal common project gets included by default but not this
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
}

jar.finalizedBy('packageSources')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            artifact packageSources
        }
    }
}

// [Team Claims] ---- The automated two-player test of the 1.4 hub (dev only) ----
//
//   pwsh tools/twoplayertest/Run-TwoPlayerTest.ps1 [-DryRun]          the one command: server + two clients + report
//   gradlew :Fabric:runTwoPlayerTestSelfCheck -PtwoPlayerTest         headless self-check of the harness (no window)
//
// The script runs :Fabric:runTwoPlayerTestServer, :Fabric:runTwoPlayerTestClient1 and :Fabric:runTwoPlayerTestClient2,
// each with -PtwoPlayerTest=<output folder>. Without -PtwoPlayerTest nothing below exists: no source set, no run config,
// no task, so the build, the jars and the other test runs are exactly as without it. The "twoplayertest" source set
// (Fabric/src/twoplayertest, mod "opac_teamclaims_twoplayertest") is only on the classpath of these four runs and never
// in any jar (no jar task reads it). Its mod does nothing without the -Dopac.twoplayertest.* properties set here.
//
//   twoPlayerTest                  the output folder (relative to the repository root); empty: build/twoPlayerTest/manual
//   twoPlayerTestTimeoutMinutes    the longest one client's scenario may take (default 25)
//   twoPlayerTestServer            the address the clients connect to (default localhost:25565)
if (project.hasProperty('twoPlayerTest')) {
    String tptValue = project.property('twoPlayerTest').toString().trim()
    File tptOut = (tptValue.isEmpty() || tptValue == 'true') ? rootProject.file("build/twoPlayerTest/manual") : rootProject.file(tptValue)
    File tptSelfCheckOut = rootProject.file("build/twoPlayerTest/selfcheck")
    String tptTimeout = (project.findProperty('twoPlayerTestTimeoutMinutes') ?: '25').toString()
    String tptServer = (project.findProperty('twoPlayerTestServer') ?: 'localhost:25565').toString()
    // the self-check counts its own gametests: a run that registered fewer cannot pass
    int tptSelfCheckTests = 6
    File tptManifest = rootProject.file("tools/twoplayertest/expected-assertions.txt")

    sourceSets {
        twoplayertest {
            java.srcDirs = ["src/twoplayertest/java"]
            resources.srcDirs = ["src/twoplayertest/resources"]
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        // The self-check gametests, a second mod (Fabric/src/twoplayertest/selfcheck) only on the classpath of
        // runTwoPlayerTestSelfCheck. Like gametestSaveCompat it gets the compiled classes of "gametest" for the
        // profile-cache mixin a gametest server needs (MixinGameTestProfileCache), but not its resources, so none of the
        // other gametests are registered there.
        twoplayertestSelfcheck {
            java.srcDirs = ["src/twoplayertest/selfcheck/java"]
            resources.srcDirs = ["src/twoplayertest/selfcheck/resources"]
            compileClasspath += sourceSets.twoplayertest.compileClasspath + sourceSets.twoplayertest.output
            runtimeClasspath += sourceSets.twoplayertest.runtimeClasspath + sourceSets.twoplayertest.output + sourceSets.gametest.output.classesDirs
        }
    }

    loom {
        mods {
            register("opac_teamclaims_twoplayertest") {
                sourceSet(sourceSets.twoplayertest)
            }
            register("opac_teamclaims_twoplayertest_selfcheck") {
                sourceSet(sourceSets.twoplayertestSelfcheck)
            }
        }
        runs {
            // The dedicated server: the repository's run-server folder (eula, online-mode=false, Player1 op), on the
            // throwaway world PerfTest-OPACHub that the script prepares.
            twoPlayerTestServer {
                server()
                setConfigName("Fabric Two-Player Test Server")
                ideConfigGenerated(false)
                runDir("../run-server")
                programArgs("nogui", "--world", "PerfTest-OPACHub")
                vmArg("-Dopac.twoplayertest.out=${tptOut.absolutePath}")
                vmArg("-Dopac.twoplayertest.role=server")
                source(sourceSets.twoplayertest)
            }
            // The two clients: own run folders (not run-client1/2 of start-all.bat), so their options.txt can be
            // the test's own (default key bindings, no pause on focus loss); 1280 x 960 allows GUI scale 4.
            twoPlayerTestClient1 {
                client()
                setConfigName("Fabric Two-Player Test Client 1")
                ideConfigGenerated(false)
                runDir("../run-tpt-client1")
                programArgs("--username", "Player1", "--width", "1280", "--height", "960")
                vmArg("-Dopac.twoplayertest.out=${tptOut.absolutePath}")
                vmArg("-Dopac.twoplayertest.role=Player1")
                vmArg("-Dopac.twoplayertest.timeoutMinutes=${tptTimeout}")
                vmArg("-Dopac.twoplayertest.server=${tptServer}")
                source(sourceSets.twoplayertest)
            }
            twoPlayerTestClient2 {
                client()
                setConfigName("Fabric Two-Player Test Client 2")
                ideConfigGenerated(false)
                runDir("../run-tpt-client2")
                programArgs("--username", "Player2", "--width", "1280", "--height", "960")
                vmArg("-Dopac.twoplayertest.out=${tptOut.absolutePath}")
                vmArg("-Dopac.twoplayertest.role=Player2")
                vmArg("-Dopac.twoplayertest.timeoutMinutes=${tptTimeout}")
                vmArg("-Dopac.twoplayertest.server=${tptServer}")
                source(sourceSets.twoplayertest)
            }
            // The headless self-check (gametest server, like runBootTest): needs no window and no game lock.
            twoPlayerTestSelfCheck {
                server()
                setConfigName("Fabric Two-Player Test Self-Check")
                ideConfigGenerated(false)
                runDir("../run-tpt-selfcheck")
                vmArg("-Dfabric-api.gametest")
                vmArg("-Dopac.twoplayertest.out=${tptSelfCheckOut.absolutePath}")
                vmArg("-Dopac.twoplayertest.role=selfcheck")
                vmArg("-Dopac.twoplayertest.manifest=${tptManifest.absolutePath}")
                source(sourceSets.twoplayertestSelfcheck)
            }
        }
    }

    // The root build.gradle copies OPAC's lang files into every ProcessResources task; they belong to the main mod only.
    ["processTwoplayertestResources", "processTwoplayertestSelfcheckResources"].each { String taskName ->
        tasks.named(taskName, ProcessResources) {
            eachFile { if (it.path.startsWith("data/${project.mod_id}/")) it.exclude() }
        }
    }
    tasks.named("processTwoplayertestSelfcheckResources", ProcessResources) {
        from("src/gametest/resources") {
            include "opac_teamclaims_gametest.mixins.json"
        }
    }

    File runDirTptSelfCheck = rootProject.file("run-tpt-selfcheck")
    tasks.named('runTwoPlayerTestSelfCheck') {
        doFirst {
            delete new File(runDirTptSelfCheck, "world"), new File(runDirTptSelfCheck, "logs/latest.log"), tptSelfCheckOut
        }
        doLast {
            File log = new File(runDirTptSelfCheck, "logs/latest.log")
            def passed = log.exists() ? (log.getText("UTF-8") =~ /All (\d+) required tests passed/) : null
            if (passed == null || !passed.find()) {
                throw new GradleException("Two-player test self-check did not pass: no \"All N required tests passed\" line in ${log}")
            }
            if (passed.group(1).toInteger() != tptSelfCheckTests) {
                throw new GradleException("Two-player test self-check ran ${passed.group(1)} tests, expected ${tptSelfCheckTests}: ${passed.group(0)} (log: ${log})")
            }
            logger.lifecycle("Two-player test self-check: ${passed.group(0)} (log: ${log})")
        }
    }
}
